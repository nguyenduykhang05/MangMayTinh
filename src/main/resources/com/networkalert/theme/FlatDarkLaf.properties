# FlatDarkLaf custom properties for Network Connection Alert System
@accentColor = #4C8DFF

# Custom App Tokens - Dark
App.bg.window = #0F141B
App.bg.surface = #161C25
App.bg.surfaceAlt = #1B2330
App.bg.hover = #212B3A
App.bg.selected = #1E3050

App.border = #263041
App.border.strong = #34425A

App.text.primary = #E6EAF2
App.text.secondary = #9AA6B8
App.text.muted = #7B879A

App.accent = #4C8DFF
App.accent.fill = #2F6FED

App.status.online = #22C55E
App.status.warning = #F59E0B
App.status.offline = #EF4444
App.status.neutral = #64748B
App.status.onlineText = #22C55E
App.status.warningText = #F59E0B
App.status.offlineText = #EF4444

# FlatLaf component styling
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
ScrollBar.width = 10
ScrollBar.thumbArc = 999
Table.rowHeight = 40
TabbedPane.tabType = underlined
TabbedPane.tabHeight = 40
SplitPaneDivider.style = grip
SplitPane.dividerSize = 8

# FlatLaf Base overrides to harmonize with design tokens
Panel.background = #0F141B
Table.background = #161C25
Table.alternateRowColor = #161C25
Table.selectionBackground = #1E3050
Table.selectionForeground = #E6EAF2
TableHeader.background = #1B2330
TableHeader.foreground = #9AA6B8
TableHeader.height = 36
TabbedPane.background = #161C25
ToolBar.background = #0F141B
Separator.foreground = #263041
