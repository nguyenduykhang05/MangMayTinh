# FlatLightLaf custom properties for Network Connection Alert System
@accentColor = #2563EB

# Custom App Tokens - Light
App.bg.window = #F3F5F9
App.bg.surface = #FFFFFF
App.bg.surfaceAlt = #EEF2F7
App.bg.hover = #E6ECF5
App.bg.selected = #DCE9FF

App.border = #DDE3EC
App.border.strong = #C5CFDD

App.text.primary = #172033
App.text.secondary = #4B5B75
App.text.muted = #5F6E88

App.accent = #2563EB
App.accent.fill = #2563EB

App.status.online = #16A34A
App.status.warning = #D97706
App.status.offline = #DC2626
App.status.neutral = #64748B
App.status.onlineText = #166534
App.status.warningText = #92400E
App.status.offlineText = #B91C1C

# FlatLaf component styling
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
ScrollBar.width = 10
ScrollBar.thumbArc = 999
Table.rowHeight = 40
TabbedPane.tabType = underlined
TabbedPane.tabHeight = 40
SplitPaneDivider.style = grip
SplitPane.dividerSize = 8

# FlatLaf Base overrides to harmonize with design tokens
Panel.background = #F3F5F9
Table.background = #FFFFFF
Table.alternateRowColor = #FFFFFF
Table.selectionBackground = #DCE9FF
Table.selectionForeground = #172033
TableHeader.background = #EEF2F7
TableHeader.foreground = #4B5B75
TableHeader.height = 36
TabbedPane.background = #FFFFFF
ToolBar.background = #F3F5F9
Separator.foreground = #DDE3EC
